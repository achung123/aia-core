upstream frontend {
    server frontend:5173;
}

upstream backend {
    server backend:8000;
}

# On native Linux/macOS ingress this keys throttling per client IP. When WSL2
# sharing goes through Windows `netsh interface portproxy`, nginx only sees the
# Windows forwarder hop, so multiple LAN clients share one rate-limit bucket.
limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=10r/s;
limit_req_status 429;
server_tokens off;

server {
    listen 80;
    server_name aia.local _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name aia.local _;

    ssl_certificate /etc/nginx/certs/aia.local.pem;
    ssl_certificate_key /etc/nginx/certs/aia.local-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Allow iPhone/DSLR card photos (backend enforces its own 10 MB cap on
    # /games/*/hands/image). Default nginx limit is 1 MB, which silently 413s
    # multi-megabyte photos before they reach the backend.
    client_max_body_size 20m;
    client_header_timeout 10s;
    client_body_timeout 15s;
    keepalive_timeout 15s;
    send_timeout 30s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    reset_timedout_connection on;

    # Keep HSTS modest on the local aia.local hostname so a bad cert rotation
    # does not pin developer browsers for weeks. Raise this on the ACME path.
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Starter CSP that stays compatible with proxied Vite HMR and Swagger UI.
    # The 3D table needs two extras: its text renderer builds glyphs in a
    # blob: web worker, and the scene lighting image is fetched from
    # raw.githubusercontent.com (fonts fall back to cdn.jsdelivr.net).
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; worker-src 'self' blob:; connect-src 'self' ws: wss: https://raw.githack.com https://raw.githubusercontent.com https://cdn.jsdelivr.net https://fonts.gstatic.com https://fonts.googleapis.com;" always;

    # Only trust X-Forwarded-For from a local proxy hop. Direct clients and
    # the WSL2 Windows portproxy path do not get to replace $remote_addr.
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        limit_req zone=api_rate_limit burst=20 nodelay;
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass http://backend;
    }

    # Live change stream (server-sent events): one long-lived connection per
    # open screen. It must not be buffered, must not be cut for running
    # long, and is not a burst of requests to rate-limit.
    location ~ ^/games/[0-9]+/events$ {
        proxy_pass http://backend;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_set_header Connection '';
    }

    location /games {
        limit_req zone=api_rate_limit burst=20 nodelay;
        proxy_pass http://backend;
    }

    location /players {
        limit_req zone=api_rate_limit burst=20 nodelay;
        proxy_pass http://backend;
    }

    location /stats {
        limit_req zone=api_rate_limit burst=20 nodelay;
        proxy_pass http://backend;
    }

    location /upload {
        limit_req zone=api_rate_limit burst=20 nodelay;
        proxy_pass http://backend;
    }

    location /images {
        limit_req zone=api_rate_limit burst=20 nodelay;
        proxy_pass http://backend;
    }

    location /docs {
        limit_req zone=api_rate_limit burst=20 nodelay;
        proxy_pass http://backend;
    }

    location /openapi.json {
        limit_req zone=api_rate_limit burst=20 nodelay;
        proxy_pass http://backend;
    }

    # Frontend — Vite dev server
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host frontend;

        # WebSocket support (Vite HMR)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # A websocket is quiet most of the time. The server-wide 30s read
        # timeout would close it every half minute, and the Vite client
        # reloads the page each time it reconnects.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
