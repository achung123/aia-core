# Resource cap baselines for trivial host-DoS protection.
# Tune after profiling real workloads so the stack stays responsive without
# leaving malformed requests or runaway reload loops free to exhaust the host.
x-mdns-resource-limits: &mdns-resource-limits
  mem_limit: 128m
  cpus: "0.25"
  pids_limit: 64

x-proxy-resource-limits: &proxy-resource-limits
  mem_limit: 256m
  cpus: "0.50"
  pids_limit: 128

x-backend-resource-limits: &backend-resource-limits
  mem_limit: 2g
  cpus: "2.00"
  pids_limit: 512

# GPU profile keeps its NVIDIA reservation and gets higher ceilings.
x-backend-gpu-resource-limits: &backend-gpu-resource-limits
  mem_limit: 6g
  cpus: "4.00"
  pids_limit: 1024

x-frontend-resource-limits: &frontend-resource-limits
  mem_limit: 1g
  cpus: "1.00"
  pids_limit: 256

# Keep the same bounded json-file policy across the shared stack unless a
# later task documents why a specific service needs different retention.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Reserve a stable proxy IP on the internal bridge so uvicorn can trust
# forwarded headers only from nginx instead of every container/client.
x-internal-network-subnet: &internal-network-subnet 172.29.0.0/24

services:
  # --- mDNS BROADCASTER ---
  # Advertises "aia.local" on your LAN via Avahi/mDNS so phones and laptops
  # can reach the app at https://aia.local without knowing the WSL IP.
  # Published UDP 5353 was evaluated but it only forwards unicast datagrams;
  # mDNS still needs direct link-local multicast participation on the host LAN.
  # WSL users still need the Windows-side broadcaster documented in
  # docs/local-network-setup.md because WSL2 NAT does not bridge that multicast.
  mdns:
    <<: *mdns-resource-limits
    image: ydkn/avahi:366@sha256:7b0560016a31da8663195930a99c43646d4d4b30301a166da25b2b4279b49557
    command: ["avahi-daemon", "--no-chroot"]
    restart: unless-stopped
    logging: *default-logging
    network_mode: host
    hostname: aia
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    tmpfs:
      - /run/avahi-daemon:uid=86,gid=86,mode=0755
    volumes:
      - ./scripts/docker/avahi/aia.service:/etc/avahi/services/aia.service:ro

  # --- REVERSE PROXY ---
  # Lightweight nginx proxy owns shared ingress on 80/443. HTTP only redirects
  # to HTTPS; mkcert-generated local certs live under scripts/docker/certs/ by
  # default, and production can swap the mounts via a compose override.
  proxy:
    <<: *proxy-resource-limits
    image: nginx:1.30.0-alpine@sha256:0272e4604ed93c1792f03695a033a6e8546840f86e0de20a884bb17d2c924883
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./scripts/docker/proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./scripts/docker/certs/aia.local.pem:/etc/nginx/certs/aia.local.pem:ro
      - ./scripts/docker/certs/aia.local-key.pem:/etc/nginx/certs/aia.local-key.pem:ro
    networks:
      edge:
      internal:
        ipv4_address: 172.29.0.2
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
        required: false
      backend-gpu:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  backend:
    <<: *backend-resource-limits
    profiles: ["cpu"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        APP_UID: ${AIA_UID:-1000}
        APP_GID: ${AIA_GID:-1000}
    logging: *default-logging
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes: &backend-volumes
      - ./backend/src:/app/src:ro
      - ./backend/alembic:/app/alembic:ro
      - ./backend/alembic.ini:/app/alembic.ini:ro
      - ./backend/pyproject.toml:/app/pyproject.toml:ro
      - ./backend/uv.lock:/app/uv.lock:ro
      - ./scripts/docker/docker-entrypoint.sh:/app/docker-entrypoint.sh:ro
      - ./scripts:/app/scripts:ro
      - ./backend/models:/app/models:ro
      - poker-data:/app/data
      # A named volume, like the database: it takes its ownership from the
      # image's `app` user, so uploads work whichever host user runs Docker.
      # A host bind mount here is owned by the host user (root under WSL)
      # and the non-root container cannot write card photos into it.
      - card-uploads:/app/uploads
    environment: &backend-env
      - PYTHONPATH=/app/src
      - DATABASE_URL=${AIA_DATABASE_URL:-sqlite:////app/data/poker.db}
      - HOME=/tmp
      - SEED_DATA=0
      # Startup skips migrations unless you opt in for a schema change or
      # first-time bootstrap: `AIA_RUN_DB_MIGRATIONS=1 docker compose ...`.
      - RUN_DB_MIGRATIONS=${AIA_RUN_DB_MIGRATIONS:-0}
      - UV_CACHE_DIR=/tmp/uv-cache
      - XDG_CACHE_HOME=/tmp/.cache
      - ALLOWED_ORIGINS=${AIA_SHARED_ALLOWED_ORIGINS:-https://aia.local}
      - UVICORN_FORWARDED_ALLOW_IPS=${AIA_TRUSTED_PROXY_IPS:-172.29.0.2}
    working_dir: /app
    networks:
      internal:
        ipv4_address: 172.29.0.3
    healthcheck: &backend-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # GPU-accelerated backend — use: docker compose --profile gpu up
  backend-gpu:
    <<: *backend-gpu-resource-limits
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: backend/Dockerfile.gpu
      args:
        APP_UID: ${AIA_UID:-1000}
        APP_GID: ${AIA_GID:-1000}
    logging: *default-logging
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes: *backend-volumes
    environment: *backend-env
    working_dir: /app
    healthcheck: *backend-healthcheck
    networks:
      internal:
        ipv4_address: 172.29.0.4
        aliases:
          - backend
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    <<: *frontend-resource-limits
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        APP_UID: ${AIA_UID:-1000}
        APP_GID: ${AIA_GID:-1000}
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/public:/app/public:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro
    environment:
      - HOME=/tmp
      - XDG_CACHE_HOME=/tmp/.cache
      # No hot-reload websocket on the shared stack: a dropped socket makes
      # the Vite client reload the page under whoever is using it.
      - AIA_DISABLE_HMR=${AIA_DISABLE_HMR:-1}
      - npm_config_cache=/tmp/.npm
    networks:
      - edge
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

volumes:
  poker-data:
  card-uploads:

networks:
  edge:
  internal:
    ipam:
      config:
        - subnet: *internal-network-subnet
